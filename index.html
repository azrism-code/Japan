<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japan Trip">
  <title>Japan Trip 2026 · v10.1.1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="place-content.css">
  <link rel="stylesheet" href="station-guides.css">
  <link rel="stylesheet" href="expenses-ui.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">⛩️ <b>Japan Trip</b><small>2026 · v10.1.1</small></div>
    <button class="icon-button" id="menuButton" aria-label="תפריט">☰</button>
  </header>
  <div class="day-strip" id="dayStrip" aria-label="ימי הטיול"></div>
  <main id="tripRoot"></main>
  <nav class="bottom-nav" aria-label="ניווט ראשי">
    <button data-nav="trip" class="active">📅<span>מסלול</span></button>
    <button data-page="pocket">🧰<span>כלים</span></button>
    <button data-page="places">📍<span>מקומות</span></button>
    <button data-action="menu">⋮<span>עוד</span></button>
  </nav>
  <div class="overlay" id="overlay"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true">
    <div class="menu-head"><b>עוד</b><button class="icon-button" data-action="close-menu">✕</button></div>
    <button data-page="take">🧳 לקחת</button>
    <button data-page="shopping">🛍️ קניות</button>
    <button data-page="flights">✈️ טיסות</button>
    <button data-page="bookings">🎟️ הזמנות</button>
    <button data-page="hotels">🏨 מלונות</button>
    <button data-page="car">🚗 השכרת רכב</button>
    <button data-page="expenses">💰 הוצאות ותקציב</button>
    <div class="cloud-account"><div data-cloud-status>טוען נתונים…</div><button data-auth-action>התחבר עם Google</button><button data-copy-share>העתק קישור צפייה</button></div>
  </aside>
  <section class="sheet-page" id="sheetPage" aria-hidden="true"></section>
  <div class="modal-backdrop" id="infoModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="close-info">✕</button>
      <div class="modal-icon" id="infoIcon">📍</div>
      <h2 id="infoTitle"></h2>
      <div class="modal-meta" id="infoMeta"></div>
      <p id="infoDesc"></p>
      <div class="modal-tip" id="infoTip"></div>
      <a class="primary-link" id="infoMap" target="_blank" rel="noopener">📍 Google Maps</a>
    </div>
  </div>
  <div class="modal-backdrop" id="eveningModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="close-evening">✕</button>
      <h2 id="eveningTitle"></h2>
      <div class="modal-meta" id="eveningDuration"></div>
      <button class="secondary-wide" id="eveningImageButton" hidden>🖼️ תמונת המסלול</button>
      <div class="notice" id="eveningOut"></div>
      <div id="eveningStops"></div>
      <div class="evening-dinner" id="eveningDinner"></div>
      <div class="notice" id="eveningBack"></div>
      <a class="primary-link" id="eveningMap" target="_blank" rel="noopener">📍 פתח מסלול הליכה במפה</a>
    </div>
  </div>
  <div class="image-overlay" id="imageOverlay" aria-hidden="true">
    <button class="image-close" data-action="close-image">✕</button>
    <img id="overlayImage" alt="">
  </div>
  <script src="trip-data.js"></script>
  <script src="place-content.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firestore-sync.js"></script>
  <script src="app.js"></script>
  <script src="car-rental.js"></script>
  <script src="drive.js"></script>
  <script src="station-guides.js"></script>
  <script src="expense-safety.js"></script>
  <script src="expenses-ui.js"></script>
  <script>
    document.addEventListener('click',e=>{
      if(!e.target.closest('[data-station-guide]'))return;
      const modal=document.getElementById('infoModal');
      modal?.classList.remove('open');
      modal?.setAttribute('aria-hidden','true');
    },true);
  </script>
</body>
</html>
