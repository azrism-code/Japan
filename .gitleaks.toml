title = "Japan Trip secret policy"

[extend]
useDefault = true

[[rules]]
id = "travel-booking-number-9-10"
description = "Travel booking/reference number in source"
regex = '''(?i)(?:booking|reservation|reference|agoda|klook)[^\n]{0,32}\b[0-9]{9,10}\b'''
keywords = ["booking", "reservation", "reference", "agoda", "klook"]

[[rules]]
id = "travel-pnr-6-char"
description = "Six-character alphanumeric travel PNR/reference with at least one digit"
regex = '''(?i)(?:pnr|booking|reservation|reference|emirates)[^\n]{0,32}\b(?:[0-9][A-Z0-9]{5}|[A-Z][0-9][A-Z0-9]{4}|[A-Z]{2}[0-9][A-Z0-9]{3}|[A-Z]{3}[0-9][A-Z0-9]{2}|[A-Z]{4}[0-9][A-Z0-9]|[A-Z]{5}[0-9])\b'''
keywords = ["pnr", "booking", "reservation", "reference", "emirates"]
